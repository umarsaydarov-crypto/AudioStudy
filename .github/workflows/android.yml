name: Build AudioStudy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AudioStudy-source-v0.2.0.zip'
      - 'patches/audiostudy-v0.3.0.patch'
      - 'patches/audiostudy-v0.4.0.patch'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract and patch AudioStudy
        run: |
          unzip AudioStudy-source-v0.2.0.zip
          git apply --recount --whitespace=nowarn patches/audiostudy-v0.3.0.patch
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("patches/audiostudy-v0.4.0.patch")
          lines = p.read_text(encoding="utf-8").splitlines(True)
          out = []
          i = 0
          while i < len(lines):
              m = re.match(r"@@ -(\\d+)(?:,(\\d+))? \\+(\\d+)(?:,(\\d+))? @@(.*)", lines[i])
              if not m:
                  out.append(lines[i]); i += 1; continue
              j = i + 1
              old_count = new_count = 0
              while j < len(lines) and not lines[j].startswith(("@@ ", "--- a/", "diff --git ")):
                  line = lines[j]
                  if line.startswith(" ") or line.startswith("-"): old_count += 1
                  if line.startswith(" ") or line.startswith("+"): new_count += 1
                  j += 1
              old_start, new_start = m.group(1), m.group(3)
              suffix = m.group(5)
              out.append(f"@@ -{old_start},{old_count} +{new_start},{new_count} @@{suffix}\\n")
              out.extend(lines[i+1:j]); i = j
          p.write_text("".join(out), encoding="utf-8")
          PY
          patch --batch --forward --fuzz=5 -p1 < patches/audiostudy-v0.4.0.patch

      - name: Build APK
        working-directory: AudioStudy
        run: gradle assembleDebug

      - name: Package updated source
        run: zip -qr AudioStudy-source-v0.4.0.zip AudioStudy

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudy-0.4.0-APK
          path: AudioStudy/app/build/outputs/apk/debug/*.apk

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudy-0.4.0-Source
          path: AudioStudy-source-v0.4.0.zip
