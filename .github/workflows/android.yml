name: Build AudioStudy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AudioStudy-source-v0.2.0.zip'
      - 'patches/audiostudy-v0.3.0.patch'
      - 'patches/audiostudy-v0.4.0.patch'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract and patch AudioStudy
        run: |
          unzip AudioStudy-source-v0.2.0.zip
          patch --batch --forward --recount --fuzz=3 -p1 < patches/audiostudy-v0.3.0.patch
          patch --batch --forward --recount --fuzz=3 -p1 < patches/audiostudy-v0.4.0.patch

      - name: Build APK
        working-directory: AudioStudy
        run: gradle assembleDebug

      - name: Package updated source
        run: zip -qr AudioStudy-source-v0.4.0.zip AudioStudy

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudy-0.4.0-APK
          path: AudioStudy/app/build/outputs/apk/debug/*.apk

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudy-0.4.0-Source
          path: AudioStudy-source-v0.3.0.zip
